services:
  db:
    image: postgres:16-alpine
    container_name: hermesafe-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hermesafe_db
      POSTGRES_USER: hermesafe_user
      POSTGRES_PASSWORD: hermesafe_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
